<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CrewCheck</title>
  <meta name="description" content="Crew health log for long space missions: daily check-in, body map, trends, radiation and a projection of how the body changes over the mission.">
  <meta name="theme-color" content="#02040b">
  <script>
    // Hide the app until the crew access screen is up, so nothing flashes before it.
    try { if (sessionStorage.getItem("crewcheck.unlocked") !== "1") document.documentElement.classList.add("pre-gate"); } catch (e) { document.documentElement.classList.add("pre-gate"); }
  </script>
  <link rel="preload" href="fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2302040b'/%3E%3Ccircle cx='20' cy='20' r='11' fill='%2316325f'/%3E%3Cpath d='M9.6 16.5A11 11 0 0 1 30.4 16.5' fill='none' stroke='%238ec5ff' stroke-width='1.6'/%3E%3Cellipse cx='20' cy='20' rx='17' ry='6' fill='none' stroke='%23f4c27a' stroke-width='1.6' transform='rotate(-24 20 20)'/%3E%3Ccircle cx='34' cy='12.6' r='2.4' fill='%23f4c27a'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="earth"><div class="lights"></div></div>
    <div class="glint"></div>
  </div>

  <div class="app" id="app">
    <header class="top">
      <a class="brand" href="#today" aria-label="CrewCheck, go to Today">
        <span id="mast-mark"></span><span class="wordmark">CrewCheck</span>
      </a>
      <nav class="nav" aria-label="Sections">
        <a href="#today" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><ellipse cx="12" cy="12" rx="9.5" ry="3.6" transform="rotate(-24 12 12)"/></svg><span>Today</span></a>
        <a href="#checkin" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Check-in</span></a>
        <a href="#trends" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-5 4 3 8-8"/></svg><span>Trends</span></a>
        <a href="#future" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Future</span></a>
        <a href="#data" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10l4 4V19.5H5z"/><path d="M9 12h6M9 15.5h6"/></svg><span>Sources</span></a>
      </nav>
      <div class="top-meta">
        <span class="meta-line"><span id="mast-day">Day —</span> · <span id="mast-place">—</span></span>
        <span class="meta-line"><time id="mast-clock">--:--</time> GMT</span>
      </div>
      <div class="pulse" id="hud-pulse" title="Latest resting heart rate">
        <svg class="ecg" viewBox="0 0 240 40" preserveAspectRatio="none" aria-hidden="true">
          <g class="ecg-track">
            <path d="M0 24 H18 l4 -3 4 3 H34 l3 4 4 -22 5 30 4 -9 H62 q6 -7 12 0 H120 H138 l4 -3 4 3 H154 l3 4 4 -22 5 30 4 -9 H182 q6 -7 12 0 H240 H258 l4 -3 4 3 H274 l3 4 4 -22 5 30 4 -9 H302 q6 -7 12 0 H360 H378 l4 -3 4 3 H394 l3 4 4 -22 5 30 4 -9 H422 q6 -7 12 0 H480" />
          </g>
        </svg>
        <span class="pulse-hr"><strong id="hud-hr">--</strong> bpm</span>
      </div>
      <button class="lock-btn" type="button" data-lock aria-label="Lock CrewCheck">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </button>
    </header>

    <main id="view" class="page" tabindex="-1"><p class="loading">Acquiring signal…</p></main>
  </div>

  <div id="gate" class="gate" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
