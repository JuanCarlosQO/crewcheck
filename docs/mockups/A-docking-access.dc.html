<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Docking — crew access</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Barlow:wght@300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:Barlow,system-ui,sans-serif}
a{color:#ff7a3d}a:hover{color:#ffa77f}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinBack{to{transform:rotate(-360deg)}}
@keyframes ridge{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes sweep{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blinkDot{0%,100%{opacity:1}50%{opacity:.2}}
.dkey{transition:border-color .2s, color .2s, background .2s}
.dkey:hover{border-color:#4a515c}
.dkey:active{border-color:#ff6a2b;color:#ff8a57;background:#140c08}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #050608; color: #e9edf2; box-sizing: border-box; padding: 26px 28px 30px; display: flex; flex-direction: column; align-items: center">
  <div aria-hidden="true" style="position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 26px 26px"></div>

  <div style="position: relative; width: 100%; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: Michroma, sans-serif; font-size: 13px; letter-spacing: 3px">CREWCHECK</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8a93a0; display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #4ad3a0; animation: blinkDot 2s ease-in-out infinite"></span>ISS · DAY 030</span>
  </div>

  <div style="position: relative; margin-top: 30px; width: 300px; height: 300px">
    <svg width="300" height="300" viewBox="0 0 300 300" aria-hidden="true" style="position: absolute; inset: 0">
      <g style="transform-origin: 150px 150px; animation: spin 90s linear infinite">
        <circle cx="150" cy="150" r="142" fill="none" stroke="#1c2027" stroke-width="1"></circle>
        <circle cx="150" cy="150" r="138" fill="none" stroke="#3a414c" stroke-width="6" stroke-dasharray="1 6.2"></circle>
      </g>
      <g style="transform-origin: 150px 150px; animation: sweep 6s linear infinite">
        <path d="M150 150 L150 10 A140 140 0 0 1 220 28.8 Z" fill="url(#sweepGrad)" opacity=".5"></path>
      </g>
      <defs>
        <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6a2b" stop-opacity="0"></stop><stop offset="1" stop-color="#ff6a2b" stop-opacity=".18"></stop></linearGradient>
      </defs>
      <path d="M150 0 V22 M150 278 V300 M0 150 H22 M278 150 H300" stroke="#4a515c" stroke-width="1"></path>
      <path d="M150 34 V58 M150 242 V266 M34 150 H58 M242 150 H266" stroke="#2a2f37" stroke-width="1" stroke-dasharray="2 3"></path>
      <path d="M144 2 L156 2 L150 12 Z" fill="#ff6a2b"></path>

      <g style="transform-origin: 150px 150px; transform: rotate({{r0}}deg); transition: transform 1.1s cubic-bezier(.2,.8,.2,1)">
        <circle cx="150" cy="150" r="122" fill="none" stroke="{{ring0}}" stroke-width="1.2"></circle>
        <path d="M118.4 32.2 A122 122 0 0 1 181.6 32.2" fill="none" stroke="{{mark0}}" stroke-width="4" stroke-linecap="round"></path>
      </g>
      <g style="transform-origin: 150px 150px; transform: rotate({{r1}}deg); transition: transform 1.1s cubic-bezier(.2,.8,.2,1)">
        <circle cx="150" cy="150" r="104" fill="none" stroke="{{ring1}}" stroke-width="1.2"></circle>
        <path d="M123.1 49.5 A104 104 0 0 1 176.9 49.5" fill="none" stroke="{{mark1}}" stroke-width="4" stroke-linecap="round"></path>
      </g>
      <g style="transform-origin: 150px 150px; transform: rotate({{r2}}deg); transition: transform 1.1s cubic-bezier(.2,.8,.2,1)">
        <circle cx="150" cy="150" r="86" fill="none" stroke="{{ring2}}" stroke-width="1.2"></circle>
        <path d="M127.7 66.9 A86 86 0 0 1 172.3 66.9" fill="none" stroke="{{mark2}}" stroke-width="4" stroke-linecap="round"></path>
      </g>
      <g style="transform-origin: 150px 150px; transform: rotate({{r3}}deg); transition: transform 1.1s cubic-bezier(.2,.8,.2,1)">
        <circle cx="150" cy="150" r="68" fill="none" stroke="{{ring3}}" stroke-width="1.2"></circle>
        <path d="M132.4 84.3 A68 68 0 0 1 167.6 84.3" fill="none" stroke="{{mark3}}" stroke-width="4" stroke-linecap="round"></path>
      </g>
    </svg>
    <button type="button" onClick="{{thumb}}" aria-label="Verify with fingerprint" style="position: absolute; left: 104px; top: 104px; width: 92px; height: 92px; border-radius: 50%; border: 1.5px solid {{coreRing}}; background: radial-gradient(circle at 50% 40%, #12161c, #07090c); color: {{coreInk}}; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: border-color .6s, color .6s">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true" style="animation: ridge 2.6s ease-in-out infinite">
        <path d="M7 19c-1.5-2-2-4-2-7a7 7 0 0 1 14 0"></path><path d="M10 20c-1-2-1.5-4-1.5-7a3.5 3.5 0 0 1 7 0c0 2 .3 4 1 6"></path><path d="M13 21c-.8-2-1-4.5-1-8"></path><path d="M4.5 8.5A8.5 8.5 0 0 1 12 3.5a8.5 8.5 0 0 1 7.5 5"></path>
      </svg>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; letter-spacing: 1.5px">{{coreLabel}}</span>
    </button>
  </div>

  <div style="position: relative; text-align: center; margin-top: 22px; animation: fade .6s ease-out both">
    <p style="margin: 0; font-family: Michroma, sans-serif; font-size: 11px; letter-spacing: 2.5px; color: {{kickerInk}}">{{kicker}}</p>
    <h1 style="margin: 10px 0 0; font-weight: 300; font-size: 30px; letter-spacing: .3px">{{title}}</h1>
    <p style="margin: 6px 0 0; font-size: 15px; color: #8a93a0">{{subtitle}}</p>
  </div>

  <sc-if value="{{notOk}}" hint-placeholder-val="{{ true }}">
    <div style="position: relative; margin-top: auto; width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="9">
        <button type="button" class="dkey" onClick="{{k.press}}" aria-label="{{k.d}}" style="height: 56px; border-radius: 14px; border: 1px solid #23272e; background: #0b0d11; color: #e9edf2; font-family: Barlow, sans-serif; font-size: 26px; font-weight: 300; cursor: pointer">{{k.d}}</button>
      </sc-for>
      <span></span>
      <button type="button" class="dkey" onClick="{{zero}}" aria-label="0" style="height: 56px; border-radius: 14px; border: 1px solid #23272e; background: #0b0d11; color: #e9edf2; font-family: Barlow, sans-serif; font-size: 26px; font-weight: 300; cursor: pointer">0</button>
      <button type="button" class="dkey" onClick="{{back}}" aria-label="Delete last digit" style="height: 56px; border-radius: 14px; border: 1px solid transparent; background: transparent; color: #8a93a0; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11v14H9l-6-7z"></path><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"></path></svg>
      </button>
    </div>
  </sc-if>

  <sc-if value="{{ok}}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 12px; animation: fade .6s ease-out .4s both">
      <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8a93a0; padding: 12px 14px; border: 1px solid #1c2027; border-radius: 12px">
        <span>ALIGNMENT 4/4</span><span>LATCH OK</span><span style="color: #4ad3a0">● NOMINAL</span>
      </div>
      <button type="button" onClick="{{reset}}" style="height: 56px; border-radius: 14px; border: 0; background: #ff6a2b; color: #0b0603; font-family: Barlow, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer">Enter the station</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pin: "", ok: false, how: "" };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const { pin, ok, how } = this.state;
    const n = ok ? 4 : pin.length;
    const offsets = [137, -96, 212, -48];
    const press = (d) => () => {
      if (this.state.ok) return;
      const next = (this.state.pin + d).slice(0, 4);
      this.setState({ pin: next });
      if (next.length === 4) this.t = setTimeout(() => this.setState({ ok: true, how: "code" }), 1100);
    };
    const v = { ok: ok, notOk: !ok };
    for (let i = 0; i < 4; i++) {
      const locked = i < n;
      v["r" + i] = locked ? 0 : offsets[i];
      v["ring" + i] = ok ? "#1f6b52" : locked ? "#5a3a2a" : "#262b33";
      v["mark" + i] = ok ? "#4ad3a0" : locked ? "#ff6a2b" : "#5b6370";
    }
    v.coreRing = ok ? "#4ad3a0" : "#3a414c";
    v.coreInk = ok ? "#4ad3a0" : "#ff8a57";
    v.coreLabel = ok ? "VERIFIED" : "TOUCH";
    v.kicker = ok ? "DOCKING COMPLETE" : "CREW AUTHENTICATION · " + n + "/4";
    v.kickerInk = ok ? "#4ad3a0" : "#ff8a57";
    v.title = ok ? "Welcome aboard, Commander" : "Align the rings";
    v.subtitle = ok ? (how === "thumb" ? "Fingerprint verified on this device" : "Code verified on this device") : "Enter your 4-digit code, or touch the centre";
    v.keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9"].map((d) => ({ d: d, press: press(d) }));
    v.zero = press("0");
    v.back = () => { if (!this.state.ok) this.setState({ pin: this.state.pin.slice(0, -1) }); };
    v.thumb = () => { if (!this.state.ok) { this.setState({ pin: "0000" }); this.t = setTimeout(() => this.setState({ ok: true, how: "thumb" }), 1100); } };
    v.reset = () => { clearTimeout(this.t); this.setState({ ok: false, pin: "", how: "" }); };
    return v;
  }
}
</script>
</body>
</html>
