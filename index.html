<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CrewCheck</title>
  <meta name="description" content="Crew health log for long space missions: daily check-in, body drawing, trends, radiation and a projection of how the body changes over the mission.">
  <meta name="theme-color" content="#ede6d8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1211" media="(prefers-color-scheme: dark)">
  <script>
    // Hide the app until the crew access screen is up, so nothing flashes before it.
    try { if (sessionStorage.getItem("crewcheck.unlocked") !== "1") document.documentElement.classList.add("pre-gate"); } catch (e) { document.documentElement.classList.add("pre-gate"); }
  </script>
  <link rel="preload" href="fonts/big-shoulders.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/martian-mono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='49' fill='%23f2551d'/%3E%3Ccircle cx='50' cy='50' r='39' fill='%23191a1c'/%3E%3Cpath d='M27 61 L42 73 L72 33' fill='none' stroke='%23f2551d' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='72' cy='33' r='5' fill='%23f7f1e3'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <div class="app" id="app">
    <header class="mast">
      <a class="mast-brand" href="#today" aria-label="CrewCheck, go to Scan">
        <span class="mast-patch" id="mast-patch"></span>
        <span class="wordmark" aria-hidden="true">Crew<span>Check</span></span>
      </a>
      <dl class="plate">
        <div class="plate-cell"><dt>Crew</dt><dd id="mast-crew">—</dd></div>
        <div class="plate-cell hide-s"><dt>Location</dt><dd id="mast-place">—</dd></div>
        <div class="plate-cell"><dt>Day</dt><dd id="mast-day">—</dd></div>
        <div class="plate-cell hide-s"><dt>Station time</dt><dd><time id="mast-clock">--:--</time> <small>GMT</small></dd></div>
      </dl>
      <div class="mast-pulse" id="hud-pulse" title="Latest resting heart rate">
        <svg class="ecg" viewBox="0 0 240 40" preserveAspectRatio="none" aria-hidden="true">
          <g class="ecg-track">
            <path d="M0 24 H18 l4 -3 4 3 H34 l3 4 4 -22 5 30 4 -9 H62 q6 -7 12 0 H120 H138 l4 -3 4 3 H154 l3 4 4 -22 5 30 4 -9 H182 q6 -7 12 0 H240 H258 l4 -3 4 3 H274 l3 4 4 -22 5 30 4 -9 H302 q6 -7 12 0 H360 H378 l4 -3 4 3 H394 l3 4 4 -22 5 30 4 -9 H422 q6 -7 12 0 H480" />
          </g>
        </svg>
        <span class="mast-hr"><strong id="hud-hr">--</strong><small>bpm</small></span>
      </div>
      <button class="lock-btn" type="button" data-lock aria-label="Lock CrewCheck">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></svg>
        <span>Lock</span>
      </button>
    </header>

    <div class="binder">
      <main id="view" class="page" tabindex="-1"><p class="loading">Opening the file…</p></main>
      <nav class="tabs" aria-label="Sections">
        <a href="#today" class="tab" style="--tab: var(--tab-1)"><b>1</b><span>Scan</span></a>
        <a href="#checkin" class="tab" style="--tab: var(--tab-2)"><b>2</b><span>Log</span></a>
        <a href="#trends" class="tab" style="--tab: var(--tab-3)"><b>3</b><span>Trends</span></a>
        <a href="#future" class="tab" style="--tab: var(--tab-4)"><b>4</b><span>Future</span></a>
        <a href="#data" class="tab" style="--tab: var(--tab-5)"><b>5</b><span>Sources</span></a>
      </nav>
    </div>
  </div>

  <div id="gate" class="gate" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
